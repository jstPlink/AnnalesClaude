server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compressione
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Asset con hash nel nome: cache lunga e immutabile
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Runtime di Workbox (nome con hash, generato da vite-plugin-pwa)
    location ~ ^/workbox-[^/]+\.js$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker, manifest e index: sempre rivalidati, così gli
    # aggiornamenti della PWA arrivano subito
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: ogni rotta sconosciuta serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
