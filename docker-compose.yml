# Avvia PocketBase (bundled, con lo schema in pb_migrations/ applicato al
# primo avvio) + il frontend insieme: un solo comando, un database tutto tuo.
#
#   docker compose up -d --build
#   apri http://localhost:8973, poi "Crea il tuo diario personale"
#
# Il database è interno: PocketBase non ha porte pubblicate e lo raggiunge solo
# il container "web" (nginx), che inoltra le chiamate /api/ dell'app. Per esporlo online
# basta pubblicare UN solo hostname (dominio proprio, Cloudflare Tunnel,
# reverse proxy...) verso la porta 8973: niente URL del database da
# configurare, niente CORS.

services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase.Dockerfile
    container_name: annales-pocketbase
    volumes:
      - pb_data:/pb/pb_data
    # Nessuna porta pubblicata: il database è interno, lo raggiunge solo il
    # container "web" (nginx) sulla rete Docker.
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        # Vuoto = stessa origin del frontend (default). Valorizzalo solo per
        # puntare a un PocketBase esterno.
        VITE_PB_URL: ${VITE_PB_URL:-}
    image: annales-diario:latest
    container_name: annales-diario
    depends_on:
      - pocketbase
    ports:
      # host:container — cambia la porta host come serve
      - "8973:80"
    restart: unless-stopped

volumes:
  pb_data:
